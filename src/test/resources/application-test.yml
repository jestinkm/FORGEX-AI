spring:
  datasource:
    url: jdbc:h2:mem:ticketflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
    admission-token-expiration-ms: 600000
  queue:
    admission-batch-size: 5
    admission-interval-ms: 1000
  rate-limit:
    ip-permits-per-second: 5
    burst-capacity: 10
    window-seconds: 1
  order:
    hold-ttl-seconds: 600
  payment:
    mock-failure-rate: 0.0
    mock-timeout-rate: 0.0
    simulate-latency-ms: 0
