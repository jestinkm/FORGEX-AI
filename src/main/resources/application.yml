spring:
  application:
    name: flash-sale-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FlashSaleHikariCP
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:100}
          max-idle: ${REDIS_POOL_MAX_IDLE:20}
          min-idle: 5
          max-wait: 2000ms

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 5000ms
    max-connections: 10000

# Application Custom Configurations
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    admission-token-expiration-ms: 600000 # 10 minutes for checkout
  queue:
    admission-batch-size: ${QUEUE_BATCH_SIZE:50}
    admission-interval-ms: ${QUEUE_INTERVAL_MS:1000}
    capacity-per-event: 100000
  rate-limit:
    ip-permits-per-second: ${RATE_LIMIT_IP_PERMITS:10}
    burst-capacity: ${RATE_LIMIT_BURST:20}
    window-seconds: 1
  order:
    hold-ttl-seconds: ${HOLD_TTL_SECONDS:600} # 10 minutes hold
    cleanup-interval-ms: 15000 # auto-release worker
  payment:
    mock-failure-rate: 0.10 # 10% simulation failure
    mock-timeout-rate: 0.05 # 5% simulation timeout
    simulate-latency-ms: 200

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{correlationId:-}] - %msg%n"
  level:
    root: INFO
    com.ticket: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
