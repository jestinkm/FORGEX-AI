<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="18.5" stroke="#334155" stroke-opacity="0.6" stroke-width="3"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Cinema Screen Curve Effect at Top -->
  <path d="M 250 80 Q 600 20 950 80" stroke="url(#glowGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <text x="600" y="70" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="4">🎬 ALL EYES THIS WAY • FAIRSEAT HIGH-CONCURRENCY ARENA</text>

  <!-- Ticket Logo Icon -->
  <g transform="translate(180, 150)">
    <rect width="100" height="100" rx="24" fill="url(#accentGrad)" filter="url(#glow)"/>
    <!-- Ticket SVG Path -->
    <path d="M30 42 C30 38 33 35 37 35 L63 35 C67 35 70 38 70 42 L70 47 C67 47 64 50 64 53 C64 56 67 59 70 59 L70 64 C70 68 67 71 63 71 L37 71 C33 71 30 68 30 64 L30 59 C33 59 36 56 36 53 C36 50 33 47 30 47 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="50" cy="53" r="3" fill="#0f172a"/>
  </g>

  <!-- Main Title -->
  <text x="310" y="200" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Fair<tspan fill="#06b6d4">Seat</tspan>
  </text>
  <rect x="580" y="160" width="130" height="28" rx="14" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="645" y="179" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">v2.5 PROD</text>

  <!-- Tagline -->
  <text x="310" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" font-style="italic">
    "Zero-Oversell High Concurrency Ticketing &amp; Immutable Blockchain Ledger"
  </text>

  <!-- Feature Pills -->
  <g transform="translate(310, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="21" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚡ 500k Virtual Queue</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="165" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="257" y="21" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔒 Zero-Oversell Locks</text>

    <!-- Pill 3 -->
    <rect x="355" y="0" width="180" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="445" y="21" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🍿 BookMyShow Layout</text>

    <!-- Pill 4 -->
    <rect x="550" y="0" width="180" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="640" y="21" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⛓️ PoA Blockchain Ledger</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)"/>
</svg>
